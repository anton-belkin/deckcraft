[package]
name = "deckcraft-agent-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "DeckCraft agent layer UI (fork): the Agent pane, topic markers on slides, prepared answers in Presenter View, linked-cells hover card"

[lints]
workspace = true

[dependencies]
deckcraft-agent = { workspace = true }
deckcraft-engine = { workspace = true }
deckcraft-geom = { workspace = true }
deckcraft-ui-egui = { workspace = true }
egui = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }

# Voice questions (native only): microphone, local Whisper, pointing markers.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
craft-voice = { git = "https://github.com/anton-belkin/craft-voice", rev = "93f74521c8169c9578b8fd0b04a76d15dc6e2d02" }

[dev-dependencies]
deckcraft-render = { workspace = true }
egui_kittest = { workspace = true, features = ["wgpu", "snapshot"] }
